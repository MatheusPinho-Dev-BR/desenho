<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Função que recebe o token do Google de forma global e garantida -->
  <script>
    var tokenGlobalGoogle = "";
    function lidarComLoginGoogle(resposta) {
      tokenGlobalGoogle = resposta.credential;
      var msg = document.getElementById("mensagem");
      if(msg) {
        msg.textContent = "Login efetuado com sucesso! Agora clique em Desenhar.";
        msg.style.color = "green";
      }
    }
  </script>
  
  <!-- Carrega a biblioteca de identidade da Google -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>Escolha um número entre 1 e 100. Cada número gera uma figura diferente, assinada com a sua conta Google.</p>
    </header>

    <!-- Configuração do botão Google -->
    <div id="g_id_onload"
         data-client_id="422699729134-0r0unka3h2j2p7fugrsm5onoml8sl95l.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="lidarComLoginGoogle"
         data-auto_prompt="false">
    </div>

    <form id="formulario" novalidate>
      <label for="numero">Número</label>
      <input id="numero" name="numero" type="number" min="1" max="100" step="1" required placeholder="42">

      <!-- Apresentação visual do botão Google -->
      <div class="g_id_signin"
           data-type="standard"
           data-shape="rectangular"
           data-theme="outline"
           data-text="signin_with"
           data-size="large"
           data-logo_alignment="left">
      </div>

      <button type="submit">Desenhar</button>
    </form>

    <p id="mensagem" role="alert"></p>

    <figure id="desenho" aria-live="polite"></figure>

    <button id="baixar" type="button" hidden>Baixar SVG</button>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
